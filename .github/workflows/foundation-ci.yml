name: MyDms S6-0 foundation checks (NOT product E2E)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  b04-evidence:
    name: b04-public-synthetic-evidence-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate public-only B04 contract with negative tests
        run: |
          node --test tests/evidence/public-synthetic.test.mjs tests/evidence/gate-a-readiness.test.mjs tests/ci/sql-infra-preflight.test.mjs tests/ci/sql-infra-evidence.test.mjs tests/evidence/b04-aws-s3-preflight.test.mjs tests/evidence/b04-cloudformation-reference.test.mjs
          node tools/evidence/check-public-synthetic.mjs fixtures/evidence/foundation-public-synthetic.example.json
          node tools/evidence/assess-b04-gate-a.mjs --public fixtures/evidence/b04-gate-a-pending.example.json
  license:
    name: mit-license-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate MIT source policy
        run: node tools/governance/check-mit-license.mjs --self-test
  dotnet:
    name: dotnet-build-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Restore with audit
        run: dotnet restore MyDms.slnx
      - name: Build
        run: dotnet build MyDms.slnx -c Release --no-restore
      - name: Unit tests (no skipped cases permitted)
        run: dotnet test tests/Unit/MyDms.UnitTests/MyDms.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=foundation-unit.trx" --results-directory artifacts/unit
      - name: Verify non-skipped unit tests and capture synthetic evidence
        env:
          MYDMS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MYDMS_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          node --test tests/ci/unit-trx-validator.test.mjs
          node tools/ci/verify-unit-trx.mjs artifacts/unit/foundation-unit.trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-evidence
          path: |
            artifacts/unit/foundation-unit.trx
            artifacts/ci/foundation-unit-metadata.json
          if-no-files-found: error
          retention-days: 7
  architecture:
    name: architecture-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node tools/architecture/check-boundaries.mjs --self-test
  frontend:
    name: react-typescript-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --fund=false
      - name: Audit dependency graph (high/critical fails CI)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
  sql-infra:
    name: disposable-sql-infra-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Disposable SQL Server smoke (NO app/schema tests)
        env:
          MYDMS_SQL_TEST_DISPOSABLE: 'YES'
          MYDMS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/sql-infra-smoke.sh
      - name: Validate synthetic-only source-bound SQL evidence after cleanup
        env:
          MYDMS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci/verify-sql-infra-evidence.mjs artifacts/ci/sql-infra-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-infra-evidence
          path: artifacts/ci/sql-infra-smoke.json
          if-no-files-found: error
          retention-days: 7
