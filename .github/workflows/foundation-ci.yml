name: MyDms S6-0 foundation checks (NOT product E2E)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  license:
    name: mit-license-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate MIT source policy
        run: node tools/governance/check-mit-license.mjs --self-test
  dotnet:
    name: dotnet-build-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Restore with audit
        run: dotnet restore MyDms.slnx
      - name: Build
        run: dotnet build MyDms.slnx -c Release --no-restore
      - name: Unit tests (no skipped cases permitted)
        run: dotnet test tests/Unit/MyDms.UnitTests/MyDms.UnitTests.csproj -c Release --no-build --logger trx --results-directory artifacts/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-evidence
          path: artifacts/unit/*.trx
          if-no-files-found: warn
          retention-days: 7
  architecture:
    name: architecture-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node tools/architecture/check-boundaries.mjs --self-test
  frontend:
    name: react-typescript-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
  sql-infra:
    name: disposable-sql-infra-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Disposable SQL Server smoke (NO app/schema tests)
        env:
          MYDMS_SQL_TEST_DISPOSABLE: 'YES'
        run: bash scripts/ci/sql-infra-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-infra-evidence
          path: artifacts/ci/sql-infra-smoke.json
          if-no-files-found: warn
          retention-days: 7
